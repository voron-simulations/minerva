[workspace]
members = ["server", "arma3"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/voron-simulations/minerva"

[workspace.dependencies]
anyhow = "1"
arma-rs = "1.13"
async-trait = "0.1"
criterion = "0.8"
minerva-server = { path = "server" }
parking_lot = "0.12"
prost = "0.14"
tokio = "1"
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
