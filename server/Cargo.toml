[package]
name = "minerva-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minerva gRPC server library: state cache and command dispatch for simulation engine plugins"
repository.workspace = true

[lib]
name = "minerva_server"
bench = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = { workspace = true, features = ["sync", "net"] }
tonic = { workspace = true, features = ["transport", "codegen"] }
tonic-prost = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tonic = { workspace = true, features = ["router"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[bench]]
name = "state"
harness = false
