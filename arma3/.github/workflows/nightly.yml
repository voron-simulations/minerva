name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions: {}

jobs:
  check:
    name: Pre-check
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - run: gh run list --limit 1 --workflow nightly.yml --json headSha --template "{{range .}}SHA={{.headSha}}{{end}}" --status completed --repo ${{ github.repository }} >> "$GITHUB_OUTPUT"
      id: last_run
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Print
      run: |
        echo Last sha: ${{ steps.last_run.outputs.sha }}
        echo Current:  ${{ github.sha }}
        echo Should cancel: ${{ steps.last_run.outputs.sha == github.sha }}
        echo ${{ github.workflow_ref }}
        echo ${{ github.action_path }}

    - if: ${{ steps.last_run.outputs.sha == github.sha }}
      run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
      env:
        GH_TOKEN: ${{ github.token }}

  build:
    name: Build
    needs: [check]
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read

  publish:
    needs: [build]
    name: Publish nightly release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Download addon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: addon
          path: .

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create nightly --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
            --title "Nightly $(date -u +%Y-%m-%d)" --notes "Automated nightly build of the Minerva extension and addon." \
            minerva-latest.zip
