[package]
name = "minerva-arma3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A panic inside the extension takes the whole Arma process down with it, so
# fallible paths must return errors to SQF instead.
[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[lib]
bench = false
crate-type = ["cdylib", "rlib"]
name = "minerva"

[dependencies]
anyhow = { workspace = true }
arma-rs = { workspace = true }
minerva-server = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
criterion = { workspace = true }

[[bench]]
name = "extension"
harness = false
