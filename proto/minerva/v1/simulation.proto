syntax = "proto3";

package minerva.v1;

import "minerva/v1/common.proto";
import "minerva/v1/weather.proto";

option csharp_namespace = "Minerva.Protocol";

message WorldSize {
  double x_meters = 1;
  double y_meters = 2;
}

message SimulationInfo {
  string world_name = 1;
  WorldSize world_size = 2;
  repeated Faction factions = 3;

  // Lowercase, stable identifier of the simulation engine (adapter) that
  // produced this data, e.g. "arma3". Future adapters use their own, e.g.
  // "dcs" or "cmo". `world_name` alone is ambiguous across engines, so clients
  // may combine it with this field to select engine-specific assets, such as
  // map images.
  string engine = 4;

  int64 simulation_start_sim_time = 10; // in-simulation time at scenario start (unix timestamp)
  int64 simulation_start_real_time = 11; // real world time of simulation start (unix timestamp)
}

message SimulationStateUpdate {
  int64 simulation_time = 1; // current in-simulation time (unix timestamp)
  float time_acceleration = 2;

  Weather weather = 10;
}

message GetSimulationInfoRequest {}

message GetSimulationInfoResponse {
  SimulationInfo info = 1;
}

message SubscribeSimulationUpdatesRequest {}

message SubscribeSimulationUpdatesResponse {
  SimulationStateUpdate state = 1;
}

service SimulationService {
  rpc GetSimulationInfo(GetSimulationInfoRequest) returns (GetSimulationInfoResponse);
  rpc SubscribeSimulationUpdates(SubscribeSimulationUpdatesRequest) returns (stream SubscribeSimulationUpdatesResponse);
}
