syntax = "proto3";

package minerva.v1;

option csharp_namespace = "Minerva.Protocol";

// A command's destination. x/y are always authoritative; a client that only
// knows the map plane (e.g. a 2D map) omits z and the adapter places the
// target at the surface. A present z is an exact altitude in meters ASL,
// for a target that isn't ground-level (e.g. an aircraft's CAP station).
message CommandTarget {
  double x = 1;
  double y = 2;
  optional double z = 3;
}

message MoveCommand {
  CommandTarget position = 1;
  string group_id = 2;
}

message SearchAndDestroyCommand {
  CommandTarget position = 1;
  string group_id = 2;
}

message DefendZoneCommand {
  string group_id = 1;
  string zone_id = 2;
  optional CommandTarget position = 3; // specific position within the zone
}

message PatrolCommand {
  string group_id = 1;
  repeated CommandTarget waypoints = 2;
  bool loop = 3; // whether to loop through waypoints
}

message SupportCommand {
  string supporter_group_id = 1;
  string supported_group_id = 2;
  string support_type = 3; // "resupply", "medical", "repair", etc.
}

enum CommandResult {
  COMMAND_RESULT_UNSPECIFIED = 0;
  COMMAND_RESULT_SUCCESS = 1;
  COMMAND_RESULT_FAILURE = 2;
}

message SendCommandRequest {
  oneof command {
    MoveCommand move = 1;
    SearchAndDestroyCommand search_and_destroy = 2;
    DefendZoneCommand defend_zone = 3;
    PatrolCommand patrol = 4;
    SupportCommand support = 5;
  }
}

message SendCommandResponse {
  CommandResult result = 1;
  string reason = 2;
}

service CommandService {
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
}
