syntax = "proto3";

package minerva.v1;

import "minerva/v1/common.proto";
import "minerva/v1/unit.proto";
import "minerva/v1/waypoint.proto";

option csharp_namespace = "Minerva.Protocol";

message GroupReadiness {
  float fuel_state = 1;
  float ammo_state = 2;
  float health_state = 3;
}

message Group {
  string id = 1;
  Side side = 2;
  GroupReadiness readiness = 3;
  bool has_task = 4;
  repeated Waypoint waypoints = 5;
  // The group's full current membership. Each unit's `group_id` equals this
  // group's `id`. An `upserted` group (see `SubscribeGroupUpdatesResponse`)
  // always carries the complete set, not a delta.
  repeated Unit units = 6;
}

message ListGroupsRequest {
  optional Side side = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message GetGroupRequest {
  string id = 1;
}

message GetGroupResponse {
  Group group = 1;
}

message SubscribeGroupUpdatesRequest {
  optional Side side = 1;
}

message SubscribeGroupUpdatesResponse {
  oneof event {
    // The group was created or changed. Sent only to subscribers whose side
    // filter (if any) matches the group's current side.
    Group upserted = 1;
    // The group with this id should no longer be tracked: it was removed,
    // or it stopped matching this subscription's side filter (e.g. its
    // side changed). Sent regardless of any side filter, since the id
    // alone doesn't carry a side to filter on.
    string removed_id = 2;
  }
}

service GroupService {
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc SubscribeGroupUpdates(SubscribeGroupUpdatesRequest) returns (stream SubscribeGroupUpdatesResponse);
}
