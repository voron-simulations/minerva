name: Build

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-extension-windows-x64:
    name: Build extension (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Init Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          add-job-id-key: false
          cache-targets: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --release -p minerva-arma3

      - name: Test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo test --release -p minerva-arma3

      # The Arma 3 loader looks for the `_x64` suffix; the cdylib is named
      # minerva.dll by cargo.
      - name: Move library
        run: move target/release/minerva.dll minerva_x64.dll

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-x64-windows
          path: minerva_x64.dll
          retention-days: 1
          if-no-files-found: error

  build-extension-linux-x64:
    name: Build extension (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Init Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          add-job-id-key: false
          cache-targets: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --release -p minerva-arma3

      - name: Test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo test --release -p minerva-arma3

      - name: Move library
        run: mv target/release/libminerva.so minerva_x64.so

      - name: Strip library
        run: strip --strip-unneeded --keep-file-symbols minerva_x64.so

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-x64-linux
          path: minerva_x64.so
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build addon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-extension-windows-x64
      - build-extension-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # HEMTT only bundles binaries sitting next to .hemtt/ (see `[files]` in
      # arma3/.hemtt/project.toml), so they go into arma3/, not the repo root.
      - name: Download Windows x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-x64-windows
          path: arma3

      - name: Download Linux x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-x64-linux
          path: arma3

      - name: Install HEMTT
        run: |
          curl -fsSL https://github.com/BrettMayson/HEMTT/releases/latest/download/linux-x64.zip -o "$RUNNER_TEMP/hemtt.zip"
          unzip -q "$RUNNER_TEMP/hemtt.zip" -d "$RUNNER_TEMP/hemtt"
          chmod +x "$RUNNER_TEMP/hemtt/hemtt"
          echo "$RUNNER_TEMP/hemtt" >> "$GITHUB_PATH"

      - name: Run HEMTT build
        working-directory: arma3
        run: hemtt release

      # HEMTT's `[files] include` globs silently match nothing when a binary
      # is missing, and the server deployment expects the `@minerva` mod
      # folder, so assert the layout instead of shipping a broken zip.
      - name: Verify addon layout
        working-directory: arma3
        run: |
          listing="$(unzip -l releases/minerva-latest.zip)"
          echo "$listing"
          for f in @minerva/minerva_x64.dll @minerva/minerva_x64.so @minerva/addons/minerva_main.pbo; do
            grep -qF " $f" <<<"$listing" || { echo "missing $f in zip"; exit 1; }
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon
          path: arma3/releases/minerva-latest.zip
          if-no-files-found: error
