name: Proto

# Separate from ci.yml because the `buf skip breaking` label must rerun this
# check when toggled, and that trigger would otherwise rerun the whole
# pipeline (including the Windows build) and cancel its in-flight run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled: buf-action skips the breaking check while the
    # `buf skip breaking` label is set, so toggling it must rerun the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proto:
    name: Proto (lint, format, breaking, push)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # buf-action comments lint/breaking results on PRs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pushes to BSR on every push to main; breaking is checked against the
      # PR base, scoped to the same subdirectory.
      - name: buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: proto
          token: ${{ secrets.BUF_TOKEN }}
